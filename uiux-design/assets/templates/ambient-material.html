<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ambient material example</title><style>
body{margin:0;font-family:system-ui;background:#141d2c;color:#f2f4fa;display:grid;min-height:100vh;place-items:center}.stage{position:relative;overflow:hidden;isolation:isolate;width:min(90vw,640px);min-height:300px;border-radius:16px;background:#1b2a3b;display:grid;place-items:center}.light{position:absolute;inset:-50%;z-index:-1;background:conic-gradient(#172839,#38737b,#3b426b,#172839);filter:blur(35px);animation:turn 20s linear infinite}.content{padding:28px;background:#182333e8;border:1px solid #a4b4c055;border-radius:10px;max-width:80%}.paused .light{animation-play-state:paused}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.light{animation:none}}button{font:inherit;padding:8px 12px}</style><main class="stage"><div class="light" aria-hidden="true"></div><div class="content"><h1>Ambient material</h1><p>Decorative lighting, with readable content and a static fallback.</p><button id="pause" aria-pressed="false">Pause effect</button></div></main><script>const b=document.getElementById('pause'),stage=document.querySelector('.stage');b.onclick=()=>{const p=stage.classList.toggle('paused');b.setAttribute('aria-pressed',String(p));b.textContent=p?'Resume effect':'Pause effect'};document.addEventListener('visibilitychange',()=>{document.querySelector('.light').style.animationPlayState=document.hidden?'paused':''})</script></html>
