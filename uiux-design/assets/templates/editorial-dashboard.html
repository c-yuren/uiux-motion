<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editorial dashboard example</title><style>
:root{color-scheme:light dark;font-family:system-ui;--accent:#397e72}*{box-sizing:border-box}body{max-width:950px;margin:0 auto;padding:clamp(18px,5vw,64px);background:Canvas;color:CanvasText}header{border-bottom:1px solid GrayText;padding-bottom:16px}small{font-size:14px}h1{font-size:clamp(34px,7vw,66px);letter-spacing:-.045em;margin:12px 0}main{display:grid;grid-template-columns:2fr 1fr;gap:32px;padding:32px 0}.hero strong{font-size:clamp(36px,8vw,72px);font-variant-numeric:tabular-nums;letter-spacing:-.05em}dl{margin:0}dt{font-size:14px}dd{margin:4px 0 20px;font-weight:600;font-variant-numeric:tabular-nums;font-size:24px}.track{height:12px;background:color-mix(in srgb,CanvasText 12%,Canvas);margin:14px 0}.fill{height:100%;width:72%;background:var(--accent)}section+section{border-left:1px solid GrayText;padding-left:24px}@media(max-width:550px){main{grid-template-columns:1fr}section+section{border-left:0;border-top:1px solid GrayText;padding:20px 0 0}}
</style><header><small>WORKSPACE / OVERVIEW</small><h1>Usage overview</h1><p>Illustrative data · not live usage</p></header><main><section class="hero" aria-label="Five-hour quota"><p>Five-hour quota remaining</p><strong>72%</strong><div class="track" aria-hidden="true"><div class="fill"></div></div><p>28% consumed in the current window.</p></section><section aria-label="Supporting metrics"><dl><dt>Weekly quota remaining</dt><dd>38%</dd><dt>Status</dt><dd>Available</dd></dl></section></main></html>
