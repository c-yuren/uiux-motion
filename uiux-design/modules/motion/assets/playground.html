<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion playground</title><style>
:root{color-scheme:light dark;font:16px system-ui;--duration:300ms;--distance:24px;--scale:.96;--curve:cubic-bezier(.2,.8,.2,1)}body{max-width:650px;margin:32px auto;padding:0 16px}fieldset{display:grid;gap:12px;border:1px solid #8886;border-radius:12px}label{display:flex;justify-content:space-between;gap:12px}button,select,input{font:inherit}button{padding:8px 14px}.stage{height:240px;position:relative;background:#8882;border-radius:14px;display:grid;place-items:center;margin:16px 0}.panel{padding:24px;border-radius:16px;background:Canvas;color:CanvasText;box-shadow:0 8px 32px #0003;opacity:0;transform:translateY(var(--distance)) scale(var(--scale));transition:transform var(--duration) var(--curve),opacity var(--duration) ease;pointer-events:none}.open .panel{opacity:1;transform:none}.reduced .panel{transition:none;transform:none}@media(prefers-reduced-motion:reduce){.panel{transition:none;transform:none}}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Motion playground</h1><p>Adjust a reversible transition. Rapidly toggle to test retargeting. Parameters are an example, not an automatic project change.</p>
<button id="toggle" aria-expanded="false" aria-controls="panel">Toggle panel</button>
<div class="stage" id="stage"><div class="panel" id="panel" aria-hidden="true">Panel content</div></div>
<fieldset><legend>Parameters</legend><label>Duration (ms)<input id="duration" type="range" min="0" max="1000" value="300"></label><label>Distance (px)<input id="distance" type="range" min="0" max="80" value="24"></label><label>Initial scale (%)<input id="scale" type="range" min="70" max="100" value="96"></label><label>Curve<select id="curve"><option value="cubic-bezier(.2,.8,.2,1)">Smooth</option><option value="linear">Linear</option><option value="cubic-bezier(.34,1.56,.64,1)">Overshoot</option></select></label><label>Reduced motion preview<input id="reduced" type="checkbox"></label><button id="reset">Reset</button></fieldset><pre id="export" aria-label="JSON parameters"></pre><button id="download">Export JSON</button>
<script>
const by=id=>document.getElementById(id), root=document.documentElement,stage=by("stage");let open=false,config;
by("toggle").onclick=()=>{open=!open;stage.classList.toggle("open",open);by("toggle").setAttribute("aria-expanded",String(open));by("panel").setAttribute("aria-hidden",String(!open))};
function update(){config={durationMs:+by("duration").value,distancePx:+by("distance").value,initialScale:+by("scale").value/100,easing:by("curve").value,reducedMotion:by("reduced").checked};root.style.setProperty("--duration",config.durationMs+"ms");root.style.setProperty("--distance",config.distancePx+"px");root.style.setProperty("--scale",config.initialScale);root.style.setProperty("--curve",config.easing);stage.classList.toggle("reduced",config.reducedMotion);by("export").textContent=JSON.stringify(config,null,2)}
document.querySelectorAll("input,select").forEach(x=>x.addEventListener("input",update));
by("reset").onclick=()=>{by("duration").value=300;by("distance").value=24;by("scale").value=96;by("curve").selectedIndex=0;by("reduced").checked=false;update()};
by("download").onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(config,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download="motion-parameters.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};update();
</script></html>
